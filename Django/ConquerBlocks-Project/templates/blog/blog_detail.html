{% extends "layout-base.html" %}

{% block head_title %} Detalles de la Noticia {% endblock %}

{% block page_content %}

    <article id="{{ post.pk }}">
        <h1> {{ post.name }} </h1>
        <p> Fecha de Publicacion: {{ post.created_at }} </p>
        <div> {{ post.content }} </div>
        <a href="{% url 'blog:blog_list' %}"> Volver a las Noticias </a>
    </article>

{% endblock %}

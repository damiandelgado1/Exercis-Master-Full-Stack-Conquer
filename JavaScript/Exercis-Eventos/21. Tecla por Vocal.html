<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <p id="pParaEliminar"> Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem provident voluptatem, itaque omnis dolores, deserunt vero molestiae porro ab nobis placeat totam nam inventore corporis excepturi quidem ducimus nostrum velit? </p>
    </main>

    <div class="button">
        <button data-letter="a"> A </button>
        <button data-letter="e"> E </button>
        <button data-letter="i"> I </button>
        <button data-letter="o"> O </button>
        <button data-letter="u"> U </button>
    </div>

    <script>
        let buttons = document.querySelectorAll('.buttons button');
        let pParaEliminar = document.getElementById('pParaEliminar');

        for (let b of buttons) {
            b.addEventListener('click', (event) => {
                let letter = event.target.dataset.letter;
                let actualText = pParaEliminar.textContent;

                actualText.replaceAll(letter, '');

                pParaEliminar.textContent = actualText;

                event.target.disabled = true;
            });
        }
    </script>
</body>
</html>

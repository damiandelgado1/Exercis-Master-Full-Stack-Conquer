<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="16. Numero por Imagen.js"></script>
    <title>Document</title>
</head>
<body>
    <main>
        <div class="imgContainer">
            <figure>
                <img id="imgCambiante" src="https://picsum.photos/200/300?r=1" alt="">
            </figure>
        </div>
    </main>

    <script>
        let imgUrls = [
            'https://picsum.photos/300/300?r=1',
            'https://picsum.photos/300/300?r=2',
            'https://picsum.photos/300/300?r=3',
            'https://picsum.photos/300/300?r=4',
            'https://picsum.photos/300/300?r=5',
            'https://picsum.photos/300/300?r=6',
            'https://picsum.photos/300/300?r=7',
            'https://picsum.photos/300/300?r=8',
            'https://picsum.photos/300/300?r=9',
            'https://picsum.photos/300/300?r=10',
        ]

        let imgCambiante = document.getElementById('imgCambiante');

        document.body.addEventListener("keydown", (event) => {
            let key = parseInt(event.key);

            if(key >= 0 && key <= 9) {
                imgCambiante.setAttribute('src', imgUrls[key]);
            } else {
                console.log('No has pulsado un Numero')
            }
        });
    </script>
</body>
</html>

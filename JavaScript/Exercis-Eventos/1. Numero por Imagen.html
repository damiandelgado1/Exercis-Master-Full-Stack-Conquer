<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <img src="https://picsum.photos/300/300" alt="" class="0">
        <img src="https://picsum.photos/300/300" alt="" class="1">
        <img src="https://picsum.photos/300/300" alt="" class="2">
        <img src="https://picsum.photos/300/300" alt="" class="3">
        <img src="https://picsum.photos/300/300" alt="" class="4">
        <img src="https://picsum.photos/300/300" alt="" class="5">
        <img src="https://picsum.photos/300/300" alt="" class="6">
        <img src="https://picsum.photos/300/300" alt="" class="7">
        <img src="https://picsum.photos/300/300" alt="" class="8">
        <img src="https://picsum.photos/300/300" alt="" class="9">
    </main>

    <script>
        // Query all img
        let img = document.querySelector('img');

        // Execute a Event "keydown" to change img
        window.addEventListener('keydown', (event) => {
            // According to a key press display this img
            const key = event.key;

            // If press a key different, change the actual img and display new img
            if (key >= '0' && key <= '9') {
                img.src = '';
                img.src = 'https://picsum.photos/300/300';
            }
        });
    </script>
</body>
</html>

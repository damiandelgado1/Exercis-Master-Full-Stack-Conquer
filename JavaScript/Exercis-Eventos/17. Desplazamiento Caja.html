<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="17. Desplazamiento Caja.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="cajaRoja"></div>

    <style>
        .cajaRoja {
            background-color: red;
            width: 100px;
            height: 100px;
            position: relative;
        }
    </style>

    <script>
        let box = document.getElementById("box");

        document.body.addEventListener("keydown", (event) => {
            // User press a cursor key to move Box
            switch (event.key) {
                case "ArrowUp":
                    alert(`El usuario pulso el cursor hacia arriba`);

                    let currentTop = box.style.top ? parseInt(box.style.top) : 0;
                    let newTop = currentTop - 10;

                    box.style.top = `${newTop}px`;

                    break;

                case "ArrowDown":
                    alert(`El usuario pulso el cursor hacia abajo`);

                    let currentBottom = box.style.bottom ? parseInt(box.style.bottom) : 0;
                    let newBottom = currentBottom + 10;

                    box.style.bottom = `${newBottom}px`

                    break;

                case "ArrowLeft":
                    alert(`El usuario pulso el cursor a la izquierda`);

                    let currentLeft = box.style.bottom ? parseInt(box.style.left) : 0;
                    let newLeft = currentLeft - 10;

                    box.style.left = `${newLeft}px`;

                    break;

                case "ArrowRight":
                    alert(`El usuario pulso el cursor a la derecha`);

                    let currentRight = box.style.right ? parseInt(box.style.right) : 0;
                    let newRight = currentRight - 10;

                    box.style.right = `${newRight}px`;

                    break;

                default:
                    console.log(`No se ha pulsado ninguna tecla`)
            }
        })
    </script>
</body>
</html>

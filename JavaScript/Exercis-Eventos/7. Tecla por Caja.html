<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .cajaRoja {
            background-color: red;
            height: 40px;
            width: 10px;
        }

        .cajaVerde {
            background-color: green;
            height: 40px;
            width: 10px;
        }
    </style>
</head>
<body>
    <main>
        <div class="cajaRoja"> Caja 1 </div>
        <div class="cajaVerde"> Caja 2 </div>
    </main>

    <script>
        let cajaRoja = document.querySelector('.cajaRoja');
        let cajaVerde = document.querySelector('.cajaVerde');

        let anchoRojo = 10;
        let anchoVerde = 10;

        let activeAction = true;

        // Press a keyboard in the page
        document.addEventListener('keydown', (event) => {
            if (!activeAction) {
                return;
            }

            // If keyword press is A increment width of the Box
            if (event.key === "a") {

                anchoRojo += 5;
                cajaRoja.style.width = `${anchoRojo}px`;

                // When Box Red have 500px width desactivate action
                if (anchoRojo == 500) {
                    console.log(`La caja roja gana`);
                    activeAction = false;
                }
            }

            // If keyword press is A increment width of the Box
            if (event.key === "ñ") {

                anchoVerde += 5;
                cajaVerde.style.width = `${anchoVerde}px`;

                // When Box Red have 500px width desactivate action
                if (anchoVerde == 500) {
                    console.log(`La caja verde gana`);
                    activeAction = false;
                }
            }
        });
</script>
</body>
</html>
